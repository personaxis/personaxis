name: CI

# Every branch, not just `main`.
#
# It used to be `branches: [main]`, and on 2026-08-29 that cost a release. The
# `feature/runtime-kernel` branch had 63 commits that had never been built or run
# anywhere but the Windows machine they were written on, because nothing triggered
# here until they reached `main`. One of them asserted the opposite of its own name
# on any platform that is not Windows, and what found it was the publish job, at the
# publish step, after the tag was already pushed.
#
# A branch that is only correct on its author's laptop is not correct, and finding
# that out from a release is finding out too late. The matrix below already covers
# three operating systems; it just was not being asked.
on:
  push:
    branches: ["**"]
  pull_request:

# Every job carries a time budget, and the numbers beside each one are measured
# rather than guessed. Two reasons, and the second is the one that bites: a job
# with no timeout that hangs runs for six hours by default, and on a metered
# repository that is the month's allowance in one afternoon. This one is public
# and unmetered, so here it is about noticing: a build that suddenly takes ten
# times what it took is a regression somebody should hear about.

permissions:
  contents: read

jobs:
  build:
    name: build & typecheck (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Measured 2026-08-30 on this workflow: 36s on ubuntu, 37 on macOS, 65 on
    # windows. Ten minutes is roughly ten times the slowest, which is a budget
    # that survives a slow runner and still catches something that hangs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 because `engines` promises it and a promise nobody tests is a guess.
        # 22 is in maintenance LTS, 24 is the active one and what a new install
        # gets today. Leaving 24 out meant not testing the version most people
        # actually run. This repository is public, so the matrix is free: what it
        # costs is wall clock, and these run in parallel.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. The action reads `packageManager` from the root
      # package.json, so CI and a laptop run the same pnpm. Pinned to 10.34.5
      # because `minimumReleaseAge` in pnpm-workspace.yaml, the 48-hour hold that
      # is this repository's defence against a compromised release, needs pnpm
      # >= 10.16 to do anything at all. `version: 10` happened to satisfy that in
      # CI and nothing said so, while a laptop on 10.13 had the setting written
      # down and not enforced.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: each package's `tsc --noEmit` typecheck resolves its workspace
      # deps through their emitted dist/*.d.ts, which only exist after a build.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run lint

  # The behavioral suite (unit + fast-check property + filesystem session tests)
  # runs once on a single fast, stable runner. Spreading it across the OS matrix
  # added no real signal but plenty of flake: Windows temp-dir cleanup races
  # (ENOTEMPTY) and vitest worker-RPC ("onTaskUpdate") timeouts on slow runners.
  # Cross-platform safety is still covered by build + typecheck across the full
  # matrix above; the heavy adversarial proof lives in the research E3 runner.
  test:
    name: test suite (ubuntu / node 22)
    runs-on: ubuntu-latest
    # Measured: 137s here, 71s locally for the whole suite, and a local build of
    # 8.5s. The gap is the install. Fifteen minutes is the budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      # Coverage, not just green. `test:coverage` runs the same suites and then holds
      # each package to the floor in vitest.floor.ts, which is where all eight numbers
      # live so they can be compared. A floor only moves up; lowering one costs a line
      # in a diff, and that is the entire mechanism.
      - name: Test, against the coverage floor
        run: pnpm run test:coverage
        env:
          # Per-push regression gate (5x the local default of 200). The core suite
          # uses the forks pool (packages/core/vitest.config.ts) so this stays clear
          # of the worker-RPC timeout even under the property suites.
          FC_NUM_RUNS: "300"

  gates:
    name: repository gates (test types, private pointers, doc references)
    runs-on: ubuntu-latest
    # Measured: 26s for the job this replaced.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Every package's tsconfig includes only src, so tsc never looks at a test file.
      # This runs the tests through the type checker with a ceiling per package that
      # only goes down.
      - name: Tests, through the type checker
        run: pnpm run check-test-types

      # This repository is public and sits beside private work. No tracked file may
      # point into it.
      - name: No public file points at private work
        run: pnpm run check-private

      # The architecture docs explain the engine by citing source files; a citation to a
      # file that no longer exists fails here.
      - name: The architecture docs cite code that exists
        run: pnpm run check-docs-refs

  evals:
    name: governance evals (deterministic, no API keys)
    runs-on: ubuntu-latest
    # Measured: 24s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Proves the governance invariants hold (clamp, gate, drift cap, episodic
      # honoring, tamper-evidence, injection block, budget stop, verification).
      # A regression fails the suite (non-zero exit) and blocks the PR.
      - name: Run governance eval suite
        run: node packages/evals/dist/index.js --out eval-report.md --markdown

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
