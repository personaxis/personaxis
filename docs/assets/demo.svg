  <text x="430" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">personaxis 0.17.0</text>
  <g class="fade v0"><text x="28" y="74" fill="#7ee787">$</text><text x="43.8" y="74" fill="#f0f6fc">personaxis create reviewer --from-prompt "A code reviewer who blocks merges without tests."</text><rect class="cover c0" x="43.8" y="60" width="764.7" height="21" fill="#0d1117"/></g><text class="fade v1" x="28" y="95" fill="#7ee787">✓ reviewer created, a governed persona, not a prose blob:</text><text class="fade v2" x="28" y="116" fill="#c9d1d9">  personas/reviewer/personaxis.md (validated PASS)</text><text class="fade v3" x="28" y="137" fill="#c9d1d9">  personas/reviewer/PERSONA.md (compiled, stage-1 offline; next compile with a model polishes it)</text><text class="fade v4" x="28" y="158" fill="#c9d1d9">  personas/reviewer/state.json (runtime state)</text><text class="fade v5" x="28" y="179" fill="#c9d1d9">  personas/reviewer/creation-report.md (provenance: 31/31 fields, 19 default(s) to review)</text><text class="fade v6" x="28" y="200" fill="#e3b341">  ! no model provider available for prompt; heuristic baseline used (labeled defaults)</text><g class="fade v7"><text x="28" y="231" fill="#7ee787">$</text><text x="43.8" y="231" fill="#f0f6fc">personaxis compile reviewer --platform claude-code</text><rect class="cover c7" x="43.8" y="217" width="440.8" height="21" fill="#0d1117"/></g><text class="fade v8" x="28" y="252" fill="#7ee787">✓ personas/reviewer/personaxis.md → personas/reviewer/PERSONA.md</text><text class="fade v9" x="28" y="273" fill="#c9d1d9">  via deterministic assembler (none)</text><text class="fade v10" x="28" y="294" fill="#7ee787">✓ host export → .claude/agents/reviewer.md</text><g class="fade v11"><text x="28" y="325" fill="#7ee787">$</text><text x="43.8" y="325" fill="#f0f6fc">personaxis proof --quick</text><rect class="cover c11" x="43.8" y="311" width="235.4" height="21" fill="#0d1117"/></g><text class="fade v12" x="28" y="346" fill="#8b949e">  1 · Adversarial storm, 1,000 hostile mutations (seed 42)</text><text class="fade v13" x="28" y="367" fill="#7ee787">  ✓ 1000 hostile steps, 440 clamped, 0 escapes from the declared box (T1)</text><text class="fade v14" x="28" y="388" fill="#7ee787">  ✓ every admitted step ≤ max_step_delta 0.15 (T2)</text><text class="fade v15" x="28" y="409" fill="#7ee787">  ✓ all 1012 record entries hash-chained and verifiable</text><text class="fade v16" x="28" y="430" fill="#8b949e">  4 · Tamper, one forged byte of memory is caught and located (T5)</text><text class="fade v17" x="28" y="451" fill="#7ee787">  ✓ one forged byte → verification fails AND names the spot: entry #1 (T5)</text>
