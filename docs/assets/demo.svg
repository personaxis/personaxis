<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="t d">
  <title id="t">personaxis in a terminal: create a persona, compile it for Claude Code, run the offline proof</title>
  <desc id="d">Three commands with their real output. personaxis create writes the persona files and labels the defaults it assumed. personaxis compile writes the document the agent reads. personaxis proof --quick checks that a thousand hostile changes never leave the declared range and that a forged byte of memory is located.</desc>
